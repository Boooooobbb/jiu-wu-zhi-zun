<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1110">
  <meta name="description" content="九五智尊 · 登峰卷：七幅画，一段同行。">
  <title>九五智尊 · 登峰卷</title>
  <link rel="icon" type="image/png" href="../assets/brand-logo-v2.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="deck" id="deck" aria-label="九五智尊 · 登峰卷">
    <a class="back" href="../index.html">← 返回营地</a>

    <div class="stage" id="stage">
      <figure class="slide" data-duration="17000">
        <div class="art">
          <img src="assets/01-peak-moon.webp" alt="月夜极岳，青龙盘绕山脊，峰顶青光如结晶。" fetchpriority="high">
        </div>
        <figcaption>极岳是一座还在慢慢长高的山。峰顶常年藏在云里，守峰人乾就守在那里。每逢月圆，云缝里会闪过一道青光。据说，那是山顶的灵感结晶在发亮</figcaption>
      </figure>

      <figure class="slide" data-duration="11000">
        <div class="art">
          <img src="assets/02-first-map.webp" alt="一只戴护目镜的小浣熊在山脚巨石上刻下寻峰地图，远处是雪峰与瀑布。">
        </div>
        <figcaption>最早的寻峰者在山脚刻了一张图，图上的路绕到一半，就断在云里。</figcaption>
      </figure>

      <figure class="slide" data-duration="8000">
        <div class="art">
          <img src="assets/03-map-copies.webp" alt="山脚石刻上的路线延伸成一张张飞散的摹本地图。">
        </div>
        <figcaption>后来，这张图被临摹了许多遍……</figcaption>
      </figure>

      <figure class="slide" data-duration="16000">
        <div class="art">
          <img src="assets/04-three-keepers.webp" alt="水獭、猫头鹰与小浣熊分别持图立于山水之间。">
        </div>
        <figcaption>其中九张传到了九只小动物手里。有爱琢磨怎么把点子做出来的水獭，有喜欢摆弄零件的小浣熊，还有走到哪儿都带着日记的猫头鹰。</figcaption>
      </figure>

      <figure class="slide" data-duration="18000">
        <div class="art">
          <img src="assets/05-nine-arrive.webp" alt="九只小动物各执一图，聚在极岳山脚。">
        </div>
        <figcaption>它们循着图来到极岳，成了后来那支叫「九五智尊」的小队。它们想看看云上到底有什么，也想一起解开沿途的难题，把那些还没做完的点子做出来。</figcaption>
      </figure>

      <figure class="slide" data-duration="8000">
        <div class="art">
          <img src="assets/06-first-night.webp" alt="夜色营地，九只小动物围火而坐。">
        </div>
        <figcaption>刚上路的时候，它们连谁守夜都差点吵起来</figcaption>
      </figure>

      <figure class="slide" data-duration="15000">
        <div class="art">
          <img src="assets/07-campfire.webp" alt="月下营火，九只小动物继续谈着前路。">
        </div>
        <figcaption>到了第五天晚上，九只小动物在营地围着营火坐下，你一言我一语，聊起各自是怎么来的，也聊起接下来的路，大家能一起做点什么</figcaption>
      </figure>
    </div>

    <div class="ui" id="ui">
      <div class="controls">
        <div class="transport">
          <button id="prev" type="button" aria-label="上一幅">‹</button>
          <button id="play" type="button" aria-label="暂停">暂停</button>
          <button id="next" type="button" aria-label="下一幅">›</button>
        </div>
        <div class="progress" id="progress" role="progressbar" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="fill"></span>
        </div>
        <span class="count" id="count">01 / 07</span>
        <button class="full" id="full" type="button" aria-label="全屏">全屏</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
